name: docs

# Builds the Lab Mango docs site: guides from this repository plus developer docs synced from the
# frontend and backend repositories. On main it publishes a container image that serves the site.
# See docs/developer/docs-workflow.md.
on:
  pull_request:
  push:
    branches: [main]
  # Sent by the frontend and backend repositories when their docs change on main.
  repository_dispatch:
    types: [frontend-docs-updated, backend-docs-updated]
  # Fallback in case a dispatch is missed.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

env:
  # Repository names default to the same owner as this repository, so the workflow keeps working
  # after the repositories move to an organization. Override with repository variables if needed.
  FRONTEND_REPO: ${{ vars.FRONTEND_REPO || format('{0}/beauty', github.repository_owner) }}
  BACKEND_REPO: ${{ vars.BACKEND_REPO || format('{0}/lab-mango', github.repository_owner) }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Sync and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out docs
        uses: actions/checkout@v4
        with:
          path: docs

      - name: Check out frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FRONTEND_REPO }}
          ref: main
          token: ${{ secrets.SOURCE_REPOS_READ_TOKEN }}
          path: beauty
          sparse-checkout: |
            README.md
            docs

      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPO }}
          ref: main
          token: ${{ secrets.SOURCE_REPOS_READ_TOKEN }}
          path: lab-mango
          # core/ is checked out whole: the sync needs the code files that docs link to.
          sparse-checkout: |
            README.md
            AGENTS.md
            docs
            core
            packages
            .github/instructions

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install
        working-directory: docs
        run: npm ci

      - name: Typecheck
        working-directory: docs
        run: npm run typecheck

      - name: Build (fails on any broken link or missing source)
        working-directory: docs
        env:
          FRONTEND_DIR: ${{ github.workspace }}/beauty
          BACKEND_DIR: ${{ github.workspace }}/lab-mango
          DOCS_REPO: ${{ github.repository }}
          DOCS_REQUIRE_ALL: "1"
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL || 'http://localhost:3001' }}
          DOCS_APP_URL: ${{ vars.DOCS_APP_URL }}
        run: npm run build

      - name: Upload site
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: |
            docs/build
            docs/Dockerfile
            docs/.dockerignore
            docs/deploy
          include-hidden-files: true
          retention-days: 14

  image:
    name: Publish image
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: ctx

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        working-directory: ctx
        run: |
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          docker build -t "$image:latest" -t "$image:${GITHUB_SHA::12}" .
          docker push --all-tags "$image"
          echo "Published $image:${GITHUB_SHA::12}" >> "$GITHUB_STEP_SUMMARY"

      # Rolling the new image out on the docs server is environment-specific: add it here
      # (for example a webhook, `kubectl set image`, or a pull on the host), or let the host
      # poll :latest. See "Deploy" in README.md.
